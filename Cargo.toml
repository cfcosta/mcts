[package]
name = "mcts-rs"
version = "0.1.0"
authors = ["Payton Webber <paytonwebber@gmail.com>"]
edition = "2021"
description = "A Rust implementation of Monte Carlo Tree Search (MCTS) using an arena allocator."
license = "MIT"
repository = "https://github.com/PaytonWebber/mcts-rs"
readme = "README.md"
keywords = ["mcts", "arena-allocator", "rust"]
categories = ["algorithms", "data-structures"]


[dependencies]
bumpalo = { version = "3", features = ["collections"] }
rand = { version = "0.8.5", features = ["small_rng"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "mcts"
harness = false

# Whole-program optimization: with the entire search monomorphized into
# one unit, LLVM can inline and lay out the hot loop globally instead of
# per codegen unit. Panics keep unwinding — the contract tests assert on
# should_panic.
[profile.release]
lto = "fat"
codegen-units = 1

# Keep debug symbols in benchmark builds so profilers (perf, flamegraph)
# can attribute samples to functions.
[profile.bench]
debug = true
